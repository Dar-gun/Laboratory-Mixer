\u002Fspan>\n<span style=\"font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 20px\">Laboratory Mixer<\u002Fspan>\n<\u002Fbutton>\n<nav aria-label=\"Main\" style=\"display: flex; flex-wrap: wrap; gap: 2px\">\n<sc-for list=\"{{ nav }}\" as=\"n\" hint-placeholder-count=\"8\">\n<button class=\"navbtn\" sc-camel-on-click=\"{{ n.go }}\" style=\"{{ n.style }}\">{{ n.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fnav>\n<\u002Fheader>\n\n<!-- HOME HERO -->\n<sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n<section style=\"background-color: #0e2f33; background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 36px 36px; color: #ffffff; padding: 64px 28px\">\n<div style=\"max-width: 1080px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 48px; align-items: center; justify-content: space-between\">\n<div style=\"flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #f2b84b\">WI 01 · Chemical Engineering Laboratory<\u002Fdiv>\n<h1 style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 64px; line-height: 1.02; letter-spacing: -0.02em\">Laboratory Mixer<\u002Fh1>\n<p style=\"margin: 0; font-size: 18px; color: #d3e2e3; max-width: 560px\">This digital platform provides information about the laboratory mixer, including its equipment details, operating procedures, maintenance, laboratory information, and safety guidelines. It also provides access to the equipment’s 3D model and supporting documents.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; margin-top: 4px\">\n<a class=\"btn\" href=\"https://q.me-qr.com/sgl9si5x\" target=\"_blank\" rel=\"noopener\" style=\"background: #f2b84b; color: #0a2326; text-decoration: none; font-weight: 600; padding: 12px 22px; border-radius: 4px; min-height: 20px\">Open the 3D model<\u002Fa>\n<button class=\"btn\" sc-camel-on-click=\"{{ goDocs }}\" style=\"background: transparent; color: #ffffff; border: 1.5px solid #8fb5b8; font-weight: 600; font-size: 16px; padding: 12px 22px; border-radius: 4px\">Laboratory manual<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 0 1 380px; min-width: 0; position: relative\">\n<img src=\"dc1f2f57-3c2c-4441-ac32-3067456bfcd2\" alt=\"The laboratory mixer: a teal frame holding the motor and shaft above a stainless steel vessel\" style=\"width: 100%; aspect-ratio: 563 / 636; object-fit: cover; display: block; border: 6px solid #f4f1ea; border-radius: 4px\">\n<div style=\"position: absolute; left: -14px; bottom: 24px; background: #f2b84b; color: #0a2326; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 13px; padding: 6px 12px; border-radius: 3px\">Unit Operations Room<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background: #ffffff; border-bottom: 1px solid #d8d2c4\">\n<div style=\"max-width: 1080px; margin: 0 auto; padding: 0 28px; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr))\">\n<sc-for list=\"{{ specs }}\" as=\"s\" hint-placeholder-count=\"5\">\n<div style=\"padding: 22px 20px 22px 0; display: flex; flex-direction: column; gap: 2px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 26px; color: #0b6f5f\">{{ s.value }}<\u002Fdiv>\n<div style=\"font-size: 14px; color: #4b5963\">{{ s.label }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<!-- INNER HERO -->\n<sc-if value=\"{{ notHome }}\" hint-placeholder-val=\"{{ false }}\">\n<section style=\"background-color: #0e2f33; background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 36px 36px; color: #ffffff; padding: 48px 28px\">\n<div style=\"max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #f2b84b\">{{ eyebrow }}<\u002Fdiv>\n<h1 style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 44px; line-height: 1.1; letter-spacing: -0.015em\">{{ title }}<\u002Fh1>\n<p style=\"margin: 0; font-size: 17px; color: #d3e2e3; max-width: 680px\">{{ desc }}<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<main style=\"max-width: 1080px; margin: 0 auto; padding: 48px 28px 88px\">\n\n<!-- ============ HOME ============ -->\n<sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display: flex; flex-direction: column; gap: 56px\">\n<div>\n<h2 style=\"margin: 0 0 20px; font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 600\">Explore the equipment<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px\">\n<sc-for list=\"{{ cards }}\" as=\"c\" hint-placeholder-count=\"7\">\n<button class=\"card\" sc-camel-on-click=\"{{ c.go }}\" style=\"text-align: left; background: #fffdf8; border: 1px solid #d8d2c4; border-radius: 6px; padding: 22px; color: #14212b; display: flex; flex-direction: column; gap: 8px; min-height: 150px\">\n<span style=\"font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 13px; color: #0b6f5f\">{{ c.n }}<\u002Fspan>\n<span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 21px; font-weight: 600; line-height: 1.2\">{{ c.title }}<\u002Fspan>\n<span style=\"font-size: 15px; color: #4b5963\">{{ c.desc }}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background: #0e2f33; color: #ffffff; border-radius: 8px; padding: 36px; display: flex; flex-wrap: wrap; gap: 36px; align-items: center\">\n<div style=\"flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #f2b84b\">3D model<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 600; line-height: 1.15\">Scan or tap to view the mixer in 3D<\u002Fh2>\n<p style=\"margin: 0; color: #d3e2e3\">Use your phone to scan the QR code, or open the link on any computer.<\u002Fp>\n<div><a class=\"btn\" href=\"https://q.me-qr.com/sgl9si5x\" target=\"_blank\" rel=\"noopener\" style=\"display: inline-block; background: #f2b84b; color: #0a2326; text-decoration: none; font-weight: 600; padding: 12px 22px; border-radius: 4px\">Open the 3D model<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<img src=\"891581c2-91ba-4e84-a26f-d096f2b27034\" alt=\"QR code linking to the 3D model of the laboratory mixer\" style=\"width: 170px; height: 170px; background: #ffffff; padding: 10px; border-radius: 6px; box-sizing: border-box; flex: 0 0 auto\">\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ EQUIPMENT ============ -->\n<sc-if value=\"{{ isEquipment }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-direction: column; gap: 56px\">\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start\">\n<div style=\"flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 22px\">\n<div>\n<h2 style=\"margin: 0 0 6px; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 600\">Purpose<\u002Fh2>\n<p style=\"margin: 0\">The laboratory mixer is designed for blending liquid formulations at laboratory scale. It is an income-generating project of the Chemical Engineering Department centered on the production of surfactant products such as fabric softeners and dishwashing detergents.<\u002Fp>\n<\u002Fdiv>\n<div>\n<h2 style=\"margin: 0 0 6px; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 600\">Applications<\u002Fh2>\n<p style=\"margin: 0\">The mixer blends liquid formulations with viscosities of up to 54,000 centipoises. It also serves as an educational resource for Unit Operation-related courses, including experiments with liquid laundry detergent and Reynolds number/Stokes’ Law using a flour-water mixture.<\u002Fp>\n<\u002Fdiv>\n<div>\n<h2 style=\"margin: 0 0 6px; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 600\">Operating principle<\u002Fh2>\n<p style=\"margin: 0\">An impeller rotates inside a vessel. The motor supplies rotational power through a belt and pulley system connected to the shaft and impellers, which impart energy and flow to the liquid. The mixer operates as a batch process.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<img src=\"dc1f2f57-3c2c-4441-ac32-3067456bfcd2\" alt=\"The laboratory mixer with its teal frame, motor, shaft and stainless steel vessel\" style=\"flex: 0 1 320px; min-width: 0; width: 320px; max-width: 100%; aspect-ratio: 563 / 636; object-fit: cover; border-radius: 4px; border: 6px solid #fffdf8; box-shadow: 0 2px 10px rgba(14,47,51,.18)\">\n<\u002Fdiv>\n\n<div>\n<h2 style=\"margin: 0 0 18px; font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 600\">Specifications<\u002Fh2>\n<dl style=\"margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0; border-top: 2px solid #14212b\">\n<sc-for list=\"{{ specTable }}\" as=\"s\" hint-placeholder-count=\"6\">\n<div style=\"padding: 14px 20px 14px 0; border-bottom: 1px solid #d8d2c4\">\n<dt style=\"font-size: 13px; color: #4b5963; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.06em\">{{ s.k }}<\u002Fdt>\n<dd style=\"margin: 0; font-weight: 600; font-size: 18px\">{{ s.v }}<\u002Fdd>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdl>\n<\u002Fdiv>\n\n<div>\n<h2 style=\"margin: 0 0 6px; font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 600\">Components<\u002Fh2>\n<p style=\"margin: 0 0 18px; color: #4b5963\">The mixer is made up of nine main parts. Each part is detachable, so it can be removed, cleaned or replaced on its own.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px\">\n<sc-for list=\"{{ components }}\" as=\"p\" hint-placeholder-count=\"9\">\n<div style=\"background: #fffdf8; border: 1px solid #d8d2c4; border-radius: 6px; padding: 16px 18px; display: flex; gap: 14px; align-items: flex-start\">\n<span style=\"font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 13px; background: #0b6f5f; color: #ffffff; border-radius: 3px; padding: 2px 7px; margin-top: 3px\">{{ p.n }}<\u002Fspan>\n<div>\n<div style=\"font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px\">{{ p.name }}<\u002Fdiv>\n<div style=\"font-size: 15px; color: #4b5963\">{{ p.fn }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div>\n<h2 style=\"margin: 0 0 6px; font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 600\">Process flow<\u002Fh2>\n<p style=\"margin: 0 0 18px; color: #4b5963\">Three flows run at the same time. The jacket wraps the outer wall of the vessel, so heating or cooling water transfers heat through the wall and never touches the product.<\u002Fp>\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n<sc-for list=\"{{ lanes }}\" as=\"l\" hint-placeholder-count=\"3\">\n<div style=\"background: #fffdf8; border: 1px solid #d8d2c4; border-radius: 6px; padding: 18px 20px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #0b6f5f; margin-bottom: 10px\">{{ l.name }}<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center\">\n<sc-for list=\"{{ l.steps }}\" as=\"s\" hint-placeholder-count=\"4\">\n<span style=\"display: inline-flex; align-items: center; gap: 8px\">\n<sc-if value=\"{{ s.notFirst }}\" hint-placeholder-val=\"{{ true }}\"><svg aria-hidden=\"true\" width=\"20\" height=\"12\" sc-camel-view-box=\"0 0 20 12\" fill=\"none\" stroke=\"#0b6f5f\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M1 6h17M13 1l5 5-5 5\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n<span style=\"background: #e6efe9; border-radius: 4px; padding: 5px 12px; font-size: 15px; font-weight: 500\">{{ s.text }}<\u002Fspan>\n<\u002Fspan>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<p style=\"margin: 14px 0 0; background: #fbe7c2; color: #5c3600; border-radius: 6px; padding: 14px 18px; font-weight: 500\">The product and utility streams never mix. Water in the product means the jacket is leaking and the unit must be stopped.<\u002Fp>\n<\u002Fdiv>\n\n<div>\n<h2 style=\"margin: 0 0 6px; font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 600\">Scope and limitations<\u002Fh2>\n<p style=\"margin: 0 0 16px; color: #4b5963\">This manual covers only the mixer of the Chemical Engineering Department in the Unit Operation Room.<\u002Fp>\n<ul style=\"margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px\">\n<li>Heating uses water only. Oil, special organic liquids and molten inorganic salts are beyond the capacity of the mixer.<\u002Fli>\n<li>Cooling is done only by circulating water through the jacket, as it was the least expensive method.<\u002Fli>\n<li>Do not exceed the 50 L capacity, the 54,000 cP viscosity limit or the 90 °C temperature limit.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ OPERATING PROCEDURE ============ -->\n<sc-if value=\"{{ isProcedure }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-direction: column; gap: 48px\">\n<div style=\"background: #fbe7c2; color: #5c3600; border-radius: 6px; padding: 18px 22px; font-weight: 500\">Assemble the mixer in the order below. Before starting, switch off and unplug the equipment, then prepare tools and materials. Operate only if you are trained and authorized, and wear the required personal protective equipment.<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); gap: 18px\">\n<sc-for list=\"{{ assembly }}\" as=\"a\" hint-placeholder-count=\"6\">\n<section style=\"background: #fffdf8; border: 1px solid #d8d2c4; border-radius: 6px; padding: 22px 24px; min-width: 0\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 13px; color: #0b6f5f\">{{ a.n }}<\u002Fdiv>\n<h2 style=\"margin: 0 0 12px; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600\">{{ a.title }}<\u002Fh2>\n<ol style=\"margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px\">\n<sc-for list=\"{{ a.steps }}\" as=\"s\" hint-placeholder-count=\"4\">\n<li>{{ s.text }}<\u002Fli>\n<\u002Fsc-for>\n<\u002Fol>\n<sc-if value=\"{{ a.hasNote }}\" hint-placeholder-val=\"{{ false }}\">\n<p style=\"margin: 14px 0 0; font-size: 15px; color: #4b5963\">{{ a.note }}<\u002Fp>\n<\u002Fsc-if>\n<\u002Fsection>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<div>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; justify-content: space-between; margin-bottom: 6px\">\n<h2 style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 600\">Final checks before the first run<\u002Fh2>\n<span style=\"font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: #0b6f5f\">{{ checkedCount }} of 8 confirmed<\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin: 0 0 16px; color: #4b5963\">Do not plug in the mixer until every item is confirmed. Tap an item to tick it off.<\u002Fp>\n<ul style=\"list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 10px\">\n<sc-for list=\"{{ checks }}\" as=\"c\" hint-placeholder-count=\"8\">\n<li>\n<button role=\"checkbox\" aria-checked=\"{{ c.aria }}\" sc-camel-on-click=\"{{ c.toggle }}\" style=\"{{ c.rowStyle }}\">\n<span style=\"{{ c.boxStyle }}\">{{ c.mark }}<\u002Fspan>\n<span>{{ c.text }}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fli>\n<\u002Fsc-for>\n<\u002Ful>\n<p style=\"margin: 16px 0 0\">Once all items are checked, plug in the mixer and run it briefly with water to confirm smooth operation. If you notice unusual noise or vibration, stop and follow the emergency actions on the Safety page.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ MAINTENANCE & TROUBLESHOOTING ============ -->\n<sc-if value=\"{{ isMaintenance }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-direction: column; gap: 64px\">\n\n<div>\n<h2 style=\"margin: 0 0 6px; font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 600\">Maintenance schedule<\u002Fh2>\n<p style=\"margin: 0 0 18px; color: #4b5963\">Maintenance is done by authorized users under the guidance of the Laboratory Head. Always switch off and unplug the mixer first, and let the jacket and vessel cool before cleaning.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px\">\n<sc-for list=\"{{ freqChips }}\" as=\"f\" hint-placeholder-count=\"5\">\n<button class=\"chip\" aria-pressed=\"{{ f.pressed }}\" sc-camel-on-click=\"{{ f.go }}\" style=\"{{ f.style }}\">{{ f.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px\">\n<sc-for list=\"{{ tasks }}\" as=\"t\" hint-placeholder-count=\"10\">\n<div style=\"background: #fffdf8; border: 1px solid #d8d2c4; border-radius: 6px; padding: 16px 18px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: #0b6f5f\">{{ t.freq }}<\u002Fdiv>\n<div style=\"font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px; margin: 2px 0 4px\">{{ t.task }}<\u002Fdiv>\n<div style=\"font-size: 15px; color: #4b5963\">{{ t.what }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; margin-top: 18px\">\n<div style=\"background: #e6efe9; border-radius: 6px; padding: 16px 18px\"><strong>Cleaning agents.<\u002Fstrong> Use mild soap and clean water. Avoid strong acids, bleach and abrasive pads, which can damage the stainless steel and the seals. Wear gloves, goggles and a lab gown, and rinse the vessel well.<\u002Fdiv>\n<div style=\"background: #e6efe9; border-radius: 6px; padding: 16px 18px\"><strong>Storage.<\u002Fstrong> Dry the vessel completely, keep the mixer unplugged, and store it in a clean, dry area with the vessel empty. Record every maintenance activity in the Maintenance Log Sheet.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div>\n<h2 style=\"margin: 0 0 6px; font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 600\">Troubleshooting guide<\u002Fh2>\n<p style=\"margin: 0 0 18px; color: #4b5963\">Switch off and unplug the mixer before checking any issue. If an issue is not listed, or does not go away after the action given, stop using the equipment and inform the Laboratory Head.<\u002Fp>\n<label for=\"issue-search\" style=\"display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px\">Search issues, causes or actions<\u002Flabel>\n<input id=\"issue-search\" type=\"text\" value=\"{{ q }}\" sc-camel-on-change=\"{{ onSearch }}\" placeholder=\"e.g. belt, vibration, leak\" style=\"width: 100%; max-width: 460px; box-sizing: border-box; font: inherit; padding: 11px 14px; border: 1.5px solid #8a9096; border-radius: 4px; background: #ffffff; color: #14212b\">\n<div style=\"font-size: 14px; color: #4b5963; margin: 10px 0 14px\">{{ issueCount }}<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px\">\n<sc-for list=\"{{ issues }}\" as=\"i\" hint-placeholder-count=\"12\">\n<article style=\"background: #fffdf8; border: 1px solid #d8d2c4; border-radius: 6px; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; min-width: 0\">\n<h3 style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 600\">{{ i.issue }}<\u002Fh3>\n<div style=\"font-size: 15px\"><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; text-transform: uppercase; color: #9a5b00\">Possible cause<\u002Fspan><br>{{ i.cause }}<\u002Fdiv>\n<div style=\"font-size: 15px\"><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; text-transform: uppercase; color: #0b6f5f\">Action<\u002Fspan><br>{{ i.action }}<\u002Fdiv>\n<\u002Farticle>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ LABORATORY INFORMATION ============ -->\n<sc-if value=\"{{ isLab }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-direction: column; gap: 64px\">\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 32px\">\n<div style=\"flex: 1 1 360px; min-width: 0\">\n<h2 style=\"margin: 0 0 6px; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 600\">Laboratory use<\u002Fh2>\n<p style=\"margin: 0\">The laboratory mixer is laboratory-scale equipment used for blending liquid formulations. It serves as an educational resource for Unit Operations and may be used for laboratory experiments involving liquid mixing. It operates as a <strong>batch process<\u002Fstrong>.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 360px; min-width: 0\">\n<h2 style=\"margin: 0 0 6px; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 600\">Laboratory applications<\u002Fh2>\n<ul style=\"margin: 0; padding-left: 22px\">\n<li>Liquid laundry detergent<\u002Fli>\n<li>Reynolds number and Stokes’ Law using a flour-water mixture<\u002Fli>\n<li>Mixer temperature control and efficiency analysis (Experiment #1, below)<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div>\n<h2 style=\"margin: 0 0 18px; font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 600\">Responsibilities<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px\">\n<sc-for list=\"{{ roles }}\" as=\"r\" hint-placeholder-count=\"4\">\n<div style=\"background: #fffdf8; border: 1px solid #d8d2c4; border-radius: 6px; padding: 20px 22px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 13px; color: #0b6f5f\">{{ r.n }}<\u002Fdiv>\n<h3 style=\"margin: 0 0 8px; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600\">{{ r.role }}<\u002Fh3>\n<ul style=\"margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 15px\">\n<sc-for list=\"{{ r.duties }}\" as=\"d\" hint-placeholder-count=\"3\">\n<li>{{ d.text }}<\u002Fli>\n<\u002Fsc-for>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div>\n<h2 style=\"margin: 0 0 6px; font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 600\">Records<\u002Fh2>\n<p style=\"margin: 0 0 18px; color: #4b5963\">These records are kept for every use of the mixer. They show who used the equipment, what was done to it, and what data was obtained.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); gap: 14px\">\n<sc-for list=\"{{ records }}\" as=\"r\" hint-placeholder-count=\"4\">\n<div style=\"background: #fffdf8; border: 1px solid #d8d2c4; border-radius: 6px; padding: 20px 22px; min-width: 0\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 13px; color: #0b6f5f\">{{ r.n }}<\u002Fdiv>\n<h3 style=\"margin: 0 0 6px; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600\">{{ r.title }}<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px\">{{ r.text }}<\u002Fp>\n<sc-if value=\"{{ r.hasCols }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px\">\n<sc-for list=\"{{ r.cols }}\" as=\"c\" hint-placeholder-count=\"5\">\n<span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; background: #e6efe9; border-radius: 3px; padding: 3px 8px\">{{ c.text }}<\u002Fspan>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #0b6f5f\">Appendix<\u002Fdiv>\n<h2 style=\"margin: 0 0 6px; font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700; line-height: 1.15\">Experiment #1: Mixer Temperature Control and Efficiency Analysis<\u002Fh2>\n<p style=\"margin: 0 0 22px; color: #4b5963\">A heat exchange study. 50 L of hot water in the mixer cools by natural convection; the model is checked against measured temperatures and used to estimate heat loss, cooling time and the hot-water temperature needed to hold 62 °C.<\u002Fp>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 28px\">\n<sc-for list=\"{{ results }}\" as=\"r\" hint-placeholder-count=\"5\">\n<div style=\"background: #0e2f33; color: #ffffff; border-radius: 6px; padding: 18px 20px\">\n<div style=\"font-size: 13px; color: #b9d2d4\">{{ r.label }}<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 20px; color: #f2b84b; overflow-wrap: anywhere\">{{ r.value }}<\u002Fdiv>\n<div style=\"font-size: 13px; color: #b9d2d4\">{{ r.sub }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start\">\n<figure style=\"margin: 0; flex: 1 1 520px; min-width: 0; background: #fffdf8; border: 1px solid #d8d2c4; border-radius: 6px; padding: 18px\">\n<svg sc-camel-view-box=\"0 0 640 320\" width=\"100%\" role=\"img\" aria-label=\"Line chart: water temperature falls from 62 degrees Celsius to 54 degrees Celsius over 60 minutes\" style=\"display: block\">\n<g stroke=\"#d8d2c4\" stroke-width=\"1\">\n<line x1=\"56\" y1=\"276\" x2=\"616\" y2=\"276\"><\u002Fline>\n<line x1=\"56\" y1=\"224.8\" x2=\"616\" y2=\"224.8\"><\u002Fline>\n<line x1=\"56\" y1=\"173.6\" x2=\"616\" y2=\"173.6\"><\u002Fline>\n<line x1=\"56\" y1=\"122.4\" x2=\"616\" y2=\"122.4\"><\u002Fline>\n<line x1=\"56\" y1=\"71.2\" x2=\"616\" y2=\"71.2\"><\u002Fline>\n<line x1=\"56\" y1=\"20\" x2=\"616\" y2=\"20\"><\u002Fline>\n<\u002Fg>\n<g font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#4b5963\" text-anchor=\"end\">\n<text x=\"48\" y=\"280\">53<\u002Ftext><text x=\"48\" y=\"229\">55<\u002Ftext><text x=\"48\" y=\"178\">57<\u002Ftext><text x=\"48\" y=\"127\">59<\u002Ftext><text x=\"48\" y=\"76\">61<\u002Ftext><text x=\"48\" y=\"24\">63<\u002Ftext>\n<\u002Fg>\n<g font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#4b5963\" text-anchor=\"middle\">\n<text x=\"56\" y=\"298\">0<\u002Ftext><text x=\"149.3\" y=\"298\">10<\u002Ftext><text x=\"242.7\" y=\"298\">20<\u002Ftext><text x=\"336\" y=\"298\">30<\u002Ftext><text x=\"429.3\" y=\"298\">40<\u002Ftext><text x=\"522.7\" y=\"298\">50<\u002Ftext><text x=\"616\" y=\"298\">60<\u002Ftext>\n<\u002Fg>\n<text x=\"336\" y=\"316\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12\" fill=\"#4b5963\">Time (min)<\u002Ftext>\n<text x=\"12\" y=\"150\" transform=\"rotate(-90 12 150)\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12\" fill=\"#4b5963\">Temperature (°C)<\u002Ftext>\n<path d=\"{{ chartPath }}\" fill=\"none\" stroke=\"#0b6f5f\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><\u002Fpath>\n<circle cx=\"56\" cy=\"45.6\" r=\"5\" fill=\"#9a5b00\"><\u002Fcircle>\n<circle cx=\"616\" cy=\"250.4\" r=\"5\" fill=\"#9a5b00\"><\u002Fcircle>\n<text x=\"66\" y=\"40\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" font-weight=\"600\" fill=\"#14212b\">62.00 °C<\u002Ftext>\n<text x=\"606\" y=\"242\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" font-weight=\"600\" fill=\"#14212b\">54.00 °C<\u002Ftext>\n<\u002Fsvg>\n<figcaption style=\"font-size: 14px; color: #4b5963; margin-top: 8px\">Calculated water temperature in 35 °C surroundings, from the fitted model.<\u002Ffigcaption>\n<\u002Ffigure>\n\n<div style=\"flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 22px\">\n<div>\n<h3 style=\"margin: 0 0 6px; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600\">Model<\u002Fh3>\n<p style=\"margin: 0 0 8px; font-size: 15px\">Newton’s law of cooling, with the cooling constant fitted to the 60-minute measurement:<\u002Fp>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-weight: 600; background: #e6efe9; border-radius: 4px; padding: 12px 14px; font-size: 15px; overflow-wrap: anywhere\">T(t) = 35 + 27 e<sup>−0.005856631 t<\u002Fsup><\u002Fdiv>\n<\u002Fdiv>\n<div>\n<h3 style=\"margin: 0 0 6px; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600\">Given data<\u002Fh3>\n<dl style=\"margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; font-size: 15px\">\n<dt>Mass of water (50 L)<\u002Fdt><dd style=\"margin: 0; font-family: 'IBM Plex Mono', monospace\">50,000 g<\u002Fdd>\n<dt>Specific heat, Cp<\u002Fdt><dd style=\"margin: 0; font-family: 'IBM Plex Mono', monospace\">4.18 J/g·°C<\u002Fdd>\n<dt>Initial temperature<\u002Fdt><dd style=\"margin: 0; font-family: 'IBM Plex Mono', monospace\">62 °C<\u002Fdd>\n<dt>Temperature at 60 min<\u002Fdt><dd style=\"margin: 0; font-family: 'IBM Plex Mono', monospace\">54 °C<\u002Fdd>\n<dt>Ambient temperature<\u002Fdt><dd style=\"margin: 0; font-family: 'IBM Plex Mono', monospace\">35 °C<\u002Fdd>\n<dt>Cooling-time target<\u002Fdt><dd style=\"margin: 0; font-family: 'IBM Plex Mono', monospace\">40 °C<\u002Fdd>\n<\u002Fdl>\n<\u002Fdiv>\n<div>\n<h3 style=\"margin: 0 0 6px; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600\">Assumptions<\u002Fh3>\n<ul style=\"margin: 0; padding-left: 20px; font-size: 15px\">\n<li>Ambient temperature stays constant at 35 °C.<\u002Fli>\n<li>The water is well mixed, so one temperature describes the whole volume.<\u002Fli>\n<li>Heat leaves only by natural convection to still air.<\u002Fli>\n<li>Cp stays constant over the temperature range.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 22px 0 0; font-size: 15px; color: #4b5963\">The original report found minimal discrepancy between the calculated values and the stopwatch-and-thermometer readings. Because k was fitted to the 60-minute reading, agreement at 60 min holds by construction; the intermediate times are the real test of the model.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ SAFETY ============ -->\n<sc-if value=\"{{ isSafety }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-direction: column; gap: 56px\">\n<p style=\"margin: 0; max-width: 760px; font-size: 17px\">The mixer is rotating equipment, so moving parts, hot surfaces and electrical connections are all present during operation. This section follows Republic Act No. 11058 and its implementing rules (DOLE Department Order No. 198, Series of 2018), and the machine guarding requirements of OSHA 29 CFR 1910.212.<\u002Fp>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; align-items: start\">\n<sc-for list=\"{{ safetyGroups }}\" as=\"g\" hint-placeholder-count=\"3\">\n<section style=\"background: #fffdf8; border: 1px solid #d8d2c4; border-radius: 6px; padding: 24px; min-width: 0\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 13px; color: #0b6f5f\">{{ g.n }}<\u002Fdiv>\n<h2 style=\"margin: 0 0 6px; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 600\">{{ g.title }}<\u002Fh2>\n<p style=\"margin: 0 0 12px; font-size: 15px; color: #4b5963\">{{ g.intro }}<\u002Fp>\n<ul style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px\">\n<sc-for list=\"{{ g.items }}\" as=\"s\" hint-placeholder-count=\"8\">\n<li style=\"display: flex; gap: 10px; align-items: flex-start; font-size: 15px\">\n<svg aria-hidden=\"true\" width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0b6f5f\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: 0 0 auto; margin-top: 4px\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg>\n<span>{{ s.text }}<\u002Fspan>\n<\u002Fli>\n<\u002Fsc-for>\n<\u002Ful>\n<\u002Fsection>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<div>\n<h2 style=\"margin: 0 0 6px; font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 600\">Emergency actions<\u002Fh2>\n<p style=\"margin: 0 0 18px; color: #4b5963\">Read this before the first run so you know what to do without looking it up.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px\">\n<sc-for list=\"{{ emergencies }}\" as=\"e\" hint-placeholder-count=\"6\">\n<div style=\"background: #fbe7c2; color: #3f2600; border-radius: 6px; padding: 18px 20px\">\n<h3 style=\"margin: 0 0 4px; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700\">{{ e.situation }}<\u002Fh3>\n<div style=\"font-size: 15px\">{{ e.action }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ 3D MODEL ============ -->\n<sc-if value=\"{{ isModel }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 44px; align-items: flex-start\">\n<figure style=\"margin: 0; flex: 1 1 380px; min-width: 0; max-width: 520px\">\n<img src=\"f57a7763-0bce-4db9-a5e0-11fdc0fc6bba\" alt=\"3D model of the laboratory mixer showing the teal frame, motor and stainless steel vessel\" style=\"width: 100%; aspect-ratio: 660 / 700; object-fit: cover; border-radius: 6px; display: block; border: 6px solid #fffdf8; box-shadow: 0 2px 10px rgba(14,47,51,.18); box-sizing: border-box\">\n<figcaption style=\"font-size: 14px; color: #4b5963; margin-top: 8px\">The 3D model of the laboratory mixer.<\u002Ffigcaption>\n<\u002Ffigure>\n<div style=\"flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n<p style=\"margin: 0; font-size: 17px\">The 3D model of the WI 01 – Laboratory Mixer is available online. It includes the major components of the mixer, such as the mixing vessel, motor, shaft and impellers, belt and pulley assembly, mixer clamp assembly, bearings, electrical wiring and switch.<\u002Fp>\n<div><a class=\"btn\" href=\"https://q.me-qr.com/sgl9si5x\" target=\"_blank\" rel=\"noopener\" style=\"display: inline-block; background: #0b6f5f; color: #ffffff; text-decoration: none; font-weight: 600; padding: 13px 24px; border-radius: 4px\">Open the 3D model<\u002Fa><\u002Fdiv>\n<div style=\"background: #fffdf8; border: 1px solid #d8d2c4; border-radius: 6px; padding: 20px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center\">\n<img src=\"891581c2-91ba-4e84-a26f-d096f2b27034\" alt=\"QR code linking to the 3D model\" style=\"width: 150px; height: 150px; background: #ffffff; border: 1px solid #d8d2c4; padding: 8px; box-sizing: border-box; flex: 0 0 auto\">\n<div style=\"flex: 1 1 200px; min-width: 0\">\n<div style=\"font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px\">Scan with your phone<\u002Fdiv>\n<div style=\"font-size: 15px; color: #4b5963\">Point your phone camera at the code to open the model, on the lab or anywhere else.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ DOCUMENTATION ============ -->\n<sc-if value=\"{{ isDocs }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-direction: column; gap: 64px\">\n\n<div style=\"background: #0e2f33; color: #ffffff; border-radius: 8px; padding: 32px 36px; display: flex; flex-wrap: wrap; gap: 24px; align-items: center; justify-content: space-between\">\n<div style=\"flex: 1 1 360px; min-width: 0\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #f2b84b\">PDF · 20 pages<\u002Fdiv>\n<h2 style=\"margin: 4px 0 6px; font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 600; line-height: 1.15\">WI 01 – Mixer: Revised Laboratory Manual<\u002Fh2>\n<p style=\"margin: 0; color: #d3e2e3\">Instructions for the use, maintenance and troubleshooting of the mixer, with safety requirements, records and Experiment #1.<\u002Fp>\n<\u002Fdiv>\n<a class=\"btn\" href=\"/_blob/9b84a1dcddf9e2f742a6227268694afc\" target=\"_blank\" rel=\"noopener\" style=\"background: #f2b84b; color: #0a2326; text-decoration: none; font-weight: 600; padding: 13px 24px; border-radius: 4px\">Open the manual (PDF)<\u002Fa>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start\">\n<div style=\"flex: 1 1 360px; min-width: 0\">\n<h2 style=\"margin: 0 0 14px; font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 600\">What the manual covers<\u002Fh2>\n<ol style=\"list-style: none; margin: 0; padding: 0; border-top: 2px solid #14212b\">\n<sc-for list=\"{{ toc }}\" as=\"t\" hint-placeholder-count=\"12\">\n<li style=\"display: flex; gap: 14px; padding: 9px 0; border-bottom: 1px solid #d8d2c4\">\n<span style=\"font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 13px; color: #0b6f5f; min-width: 32px; margin-top: 3px\">{{ t.n }}<\u002Fspan>\n<span>{{ t.title }}<\u002Fspan>\n<\u002Fli>\n<\u002Fsc-for>\n<\u002Fol>\n<\u002Fdiv>\n<div style=\"flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 32px\">\n<div>\n<h2 style=\"margin: 0 0 14px; font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 600\">Associated documents<\u002Fh2>\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<div style=\"background: #fffdf8; border: 1px solid #d8d2c4; border-radius: 6px; padding: 14px 18px\"><strong>Borrower’s Logbook.<\u002Fstrong> Names the students who used the mixer. Kept in the unit operation laboratory and handled by the laboratory head.<\u002Fdiv>\n<div style=\"background: #fffdf8; border: 1px solid #d8d2c4; border-radius: 6px; padding: 14px 18px\"><strong>Maintenance Log Sheet.<\u002Fstrong> Records when the equipment is in maintenance, and by whom.<\u002Fdiv>\n<div style=\"background: #fffdf8; border: 1px solid #d8d2c4; border-radius: 6px; padding: 14px 18px\"><strong>Occupational Safety and Health Standards.<\u002Fstrong> Use of the mixer must adhere to them, including guarding, vibration monitoring and appropriate safety clothing.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<h2 style=\"margin: 0 0 14px; font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 600\">References<\u002Fh2>\n<ul style=\"margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 15px\">\n<li>Department of Labor and Employment. (2014). Department Order No. 136, Series of 2014: Guidelines for the implementation of a Chemical Safety Program in workplaces.<\u002Fli>\n<li>Department of Labor and Employment. (2018). Department Order No. 198, Series of 2018: Implementing Rules and Regulations of Republic Act No. 11058.<\u002Fli>\n<li>Occupational Safety and Health Administration. (n.d.). 29 CFR 1910.147: The control of hazardous energy (lockout/tagout).<\u002Fli>\n<li>Occupational Safety and Health Administration. (n.d.). 29 CFR 1910.212: General requirements for all machines.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div>\n<h2 style=\"margin: 0 0 18px; font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 600\">Definitions<\u002Fh2>\n<dl style=\"margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px\">\n<sc-for list=\"{{ defs }}\" as=\"d\" hint-placeholder-count=\"9\">\n<div style=\"background: #fffdf8; border: 1px solid #d8d2c4; border-radius: 6px; padding: 16px 18px\">\n<dt style=\"font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px\">{{ d.term }}<\u002Fdt>\n<dd style=\"margin: 4px 0 0; font-size: 15px; color: #4b5963\">{{ d.text }}<\u002Fdd>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdl>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fmain>\n\n<footer style=\"background: #0a2326; color: #b9d2d4; padding: 26px 28px; text-align: center; font-size: 14px\">WI 01 – Laboratory Mixer · Chemical Engineering Department · Unit Operation Room<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1500}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { page: 'home', freq: 'all', q: '', checks: {} };\n  }\n  renderVals() {\n    const st = this.state;\n    const page = st.page;\n    const pad = (i) => (i < 9 ? '0' : '') + (i + 1);\n    const go = (id) => () => {\n      this.setState({ page: id });\n      try { window.scrollTo(0, 0); } catch (e) {}\n    };\n    const pages = [\n      { id: 'home', label: 'Home', title: 'Home', desc: '' },\n      { id: 'equipment', label: 'Equipment Information', title: 'Equipment Information', desc: 'Purpose, specifications, the nine main components and how the three process flows work.' },\n      { id: 'procedure', label: 'Operating Procedure', title: 'Operating Procedure', desc: 'Step-by-step assembly in the correct order, followed by the final checks before the first run.' },\n      { id: 'maintenance', label: 'Maintenance & Troubleshooting', title: 'Maintenance & Troubleshooting', desc: 'The maintenance schedule and a searchable guide to the most likely issues.' },\n      { id: 'lab', label: 'Laboratory Information', title: 'Laboratory Information', desc: 'Laboratory use, who is responsible for what, the records to keep, and Experiment #1.' },\n      { id: 'safety', label: 'Safety Information', title: 'Safety Information', desc: 'Safety precautions, electrical and chemical safety, and what to do in an emergency.' },\n      { id: 'model', label: '3D Model', title: '3D Model', desc: 'View the mixer in 3D by scanning the QR code or opening the link.' },\n      { id: 'docs', label: 'Documentation & References', title: 'Documentation & References', desc: 'The revised laboratory manual, associated documents, definitions and references.' }\n    ];\n    const current = pages.find((p) => p.id === page) || pages[0];\n    const nav = pages.map((p) => ({\n      label: p.label,\n      go: go(p.id),\n      style: 'background: none; border: 0; border-radius: 4px; padding: 9px 12px; font-size: 15px; font-weight: ' + (p.id === page ? '600' : '400') + '; color: ' + (p.id === page ? '#0a2326' : '#d3e2e3') + '; background-color: ' + (p.id === page ? '#f2b84b' : 'transparent')\n    }));\n    const cards = pages.filter((p) => p.id !== 'home').map((p, i) => ({ n: pad(i), title: p.title, desc: p.desc, go: go(p.id) }));\n    const idx = pages.findIndex((p) => p.id === page);\n\n    // equipment\n    const comps = [\n      ['Main vessel', 'Holds the mixture. Stainless steel, 50 L total capacity.'],\n      ['Jacket', 'Carries heating or cooling water around the vessel wall.'],\n      ['Motor', 'Drives the mixer. Rated at 370 W.'],\n      ['Pulley', 'Transfers motor rotation to the belt.'],\n      ['Belt', 'Transmits power from the motor pulley to the shaft pulley.'],\n      ['Shaft', 'Carries torque from the pulley to the impellers.'],\n      ['Impellers', 'Create flow and blend the contents.'],\n      ['Mixer clamp', 'Secures the mixer assembly to the vessel.'],\n      ['Foam', 'Placed at the base. Cushions the unit, reduces vibration, and gives slight insulation against heat loss to the floor or table.']\n    ];\n    const lanes = [\n      { name: 'Product stream', steps: ['Raw materials charged', 'Blended by impellers', 'Discharge valve', 'Finished product'] },\n      { name: 'Power transmission', steps: ['Motor', 'Belt and pulley', 'Shaft', 'Impellers'] },\n      { name: 'Utility stream', steps: ['Water in', 'Circulates through jacket (heating below 90 °C, or cooling)', 'Water out'] }\n    ].map((l) => ({ name: l.name, steps: l.steps.map((s, i) => ({ text: s, notFirst: i > 0 })) }));\n\n    // procedure\n    const assembly = [\n      { n: '9.1', title: 'Main vessel assembly', steps: ['Place the vessel on a flat, stable surface with enough space for adding ingredients.', 'Check the vessel and jacket for dents, cracks and leaks.', 'Connect the jacket water inlet and outlet and tighten the fittings.', 'Make sure the discharge valve is closed.'] },\n      { n: '9.2', title: 'Motor installation', steps: ['Mount the motor on its base and align it with the shaft position.', 'Fasten the mounting bolts but do not fully tighten them yet, so the belt tension can be adjusted later.', 'Make sure the rear ventilation outlet of the motor is not blocked.', 'Keep the power cord disconnected until the final checks are done.'] },\n      { n: '9.3', title: 'Mixer clamp assembly', steps: ['Position the clamp on the vessel at the marked mounting point.', 'Tighten the clamp evenly.', 'Check that the mixer assembly does not shift when pushed lightly.'] },\n      { n: '9.4', title: 'Belt, pulley and shaft assembly', steps: ['Attach the pulleys to the motor shaft and the mixer shaft.', 'Align both pulleys so the belt runs straight.', 'Fit the belt over both pulleys.', 'Adjust the motor position until the belt is snug and has slight give when pressed. Then fully tighten the motor bolts.', 'Grease the shaft bearings.', 'Turn the shaft by hand to check that it rotates freely.'] },\n      { n: '9.5', title: 'Impellers installation', steps: ['Slide the impellers onto the lower end of the shaft at the specified height.', 'Tighten the set screws so the impellers cannot slip.', 'Lower the shaft into the vessel and make sure the impellers do not touch the wall.'] },\n      { n: '9.6', title: 'Foam installation', steps: ['Clean and dry the underside of the base and the surface where the foam will sit.', 'Cut or select the foam to match the footprint of the base.', 'Attach the foam to the underside of the base, covering all contact points with the floor or table.', 'Press down firmly so it sits flat with no gaps or folds.'], note: 'Install the foam last so it does not shift while the other parts are being assembled.' }\n    ].map((a) => ({ n: a.n, title: a.title, steps: a.steps.map((t) => ({ text: t })), hasNote: !!a.note, note: a.note || '' }));\n    const checkTexts = ['All bolts, clamps and set screws are tight.', 'The belt is aligned and properly tensioned.', 'The guards are in place.', 'The shaft turns freely by hand.', 'The impellers are clear of the vessel wall.', 'The jacket has no leaks.', 'The ventilation outlet is clear.', 'The foam is flat and the mixer sits level without wobbling.'];\n    const checks = checkTexts.map((t, i) => {\n      const on = !!st.checks[i];\n      return {\n        text: t,\n        aria: on ? 'true' : 'false',\n        mark: on ? '✓' : '',\n        toggle: () => { const c = Object.assign({}, this.state.checks); c[i] = !c[i]; this.setState({ checks: c }); },\n        rowStyle: 'width: 100%; text-align: left; font-size: 15px; display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 6px; border: 1.5px solid ' + (on ? '#0b6f5f' : '#d8d2c4') + '; background: ' + (on ? '#e6efe9' : '#fffdf8') + '; color: #14212b; min-height: 48px',\n        boxStyle: 'flex: 0 0 auto; width: 22px; height: 22px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; border: 2px solid #0b6f5f; background: ' + (on ? '#0b6f5f' : '#ffffff') + '; color: #ffffff'\n      };\n    });\n    const checkedCount = checkTexts.filter((t, i) => st.checks[i]).length;\n\n    // maintenance\n    const allTasks = [\n      { f: 'after', task: 'Clean the vessel, shaft and impellers', what: 'Rinse with clean water and wipe off any product left on the vessel wall, shaft and impellers. Dried residue can cause imbalance and can affect the next batch.' },\n      { f: 'after', task: 'Wipe the exterior', what: 'Wipe the motor, base and frame with a damp cloth to remove dust and spills. Keep water away from the motor and electrical parts.' },\n      { f: 'before', task: 'Inspect the power cord, plug and switch', what: 'Check for cracks, exposed wires and loose connections.' },\n      { f: 'before', task: 'Check bolts, clamp and set screws', what: 'Retighten anything that is loose.' },\n      { f: 'monthly', task: 'Check the belt', what: 'Inspect for wear, cracks and proper tension. Replace if damaged.' },\n      { f: 'monthly', task: 'Grease the shaft bearings', what: 'Apply grease to the bearings so the shaft keeps turning smoothly.' },\n      { f: 'monthly', task: 'Check the jacket and fittings', what: 'Look for leaks at the inlet, outlet and vessel wall. Drain the jacket if the mixer will not be used for a long time.' },\n      { f: 'monthly', task: 'Clear the ventilation outlet', what: 'Remove dust that could block air flow to the motor.' },\n      { f: 'monthly', task: 'Inspect the foam base', what: 'Check that the foam is flat, firmly attached and not worn.' },\n      { f: 'semester', task: 'Full check-up of the mixer', what: 'Inspect all moving parts, connections and electrical components. Replace worn parts.' }\n    ];\n    const freqLabel = { after: 'After every use', before: 'Before every use', monthly: 'Monthly', semester: 'Every semester, or when problems are observed' };\n    const chipDefs = [['all', 'All tasks'], ['after', 'After every use'], ['before', 'Before every use'], ['monthly', 'Monthly'], ['semester', 'Every semester']];\n    const freqChips = chipDefs.map((c) => ({\n      label: c[1],\n      pressed: st.freq === c[0] ? 'true' : 'false',\n      go: () => this.setState({ freq: c[0] }),\n      style: 'font-size: 14px; font-weight: 500; padding: 8px 16px; border-radius: 999px; min-height: 40px; border: 1.5px solid ' + (st.freq === c[0] ? '#0b6f5f' : '#bdb7a8') + '; background: ' + (st.freq === c[0] ? '#0b6f5f' : '#fffdf8') + '; color: ' + (st.freq === c[0] ? '#ffffff' : '#14212b')\n    }));\n    const tasks = allTasks.filter((t) => st.freq === 'all' || t.f === st.freq).map((t) => ({ freq: freqLabel[t.f], task: t.task, what: t.what }));\n\n    const allIssues = [\n      ['Mixer does not turn on', 'No power, tripped breaker, blown fuse, or damaged cord', 'Check that the plug is firmly in a working grounded outlet. Inspect the breaker, the fuse and the cord. Do not use the mixer if the cord or plug is damaged.'],\n      ['Faulty switch', 'Worn or loose switch', 'Check the switch with the power off and unplugged. If it still does not respond properly, have it replaced.'],\n      ['Motor hums but the shaft does not turn', 'Overloaded motor, jammed impeller, or slipped or broken belt', 'Switch off and unplug. Check that the vessel is not overloaded and that nothing is blocking the impellers. Inspect the belt.'],\n      ['Motor overheats', 'Blocked ventilation outlet, heavy load, or long continuous use', 'Stop the mixer and let the motor cool. Clear the rear ventilation outlet. Keep the load within the 54,000 cP viscosity limit.'],\n      ['Excessive vibration or noise', 'Worn bearings, loose bolts, set screws or clamp, or misaligned pulleys', 'Tighten all fasteners, check the pulley alignment, and grease the bearings. Replace the bearings if the noise continues.'],\n      ['Burning smell', 'Short circuit, overloaded motor, or slipping belt', 'Switch off and unplug right away. Do not use the mixer until the Laboratory Head has checked it.'],\n      ['Belt slipping, squealing, or worn', 'Loose belt, misaligned pulleys, or a worn belt', 'Adjust the belt tension as in the belt, pulley and shaft assembly step. Realign the pulleys. Replace the belt if it is cracked or frayed.'],\n      ['Mixer assembly shifts during operation', 'Loose clamp', 'Stop the mixer and retighten the clamp evenly.'],\n      ['Poor or slow mixing', 'Wrong impeller, impeller set at the wrong height, or batch volume too low or too high', 'Check the impeller type and height. Keep the batch within the 50 L capacity.'],\n      ['Water in the product', 'Leak in the jacket', 'Stop the mixer right away, drain the jacket, and report it to the Laboratory Head. Do not use the batch.'],\n      ['Product leaking from the discharge valve', 'Valve not fully closed or worn seal', 'Close the valve fully and check the seal. Replace it if the leak continues.'],\n      ['Foam is flat or the unit wobbles', 'Foam is worn, folded, or has moved', 'Remove the old foam and reinstall it as in the foam installation step.']\n    ];\n    const needle = st.q.trim().toLowerCase();\n    const shown = allIssues.filter((r) => !needle || (r[0] + ' ' + r[1] + ' ' + r[2]).toLowerCase().indexOf(needle) >= 0);\n    const issues = shown.map((r) => ({ issue: r[0], cause: r[1], action: r[2] }));\n    const issueCount = shown.length === 0 ? 'No matching issues. If it is not listed, stop using the equipment and inform the Laboratory Head.' : (needle ? shown.length + ' of ' + allIssues.length + ' issues shown' : allIssues.length + ' issues');\n\n    // lab\n    const roles = [\n      { role: 'Laboratory Head', duties: ['Regular maintenance and calibration of the equipment.', 'Monitoring the equipment’s performance.', 'Addressing any issue that arises with the equipment.', 'Ensuring that researchers are authorized and trained to use the equipment.'] },\n      { role: 'Researchers', duties: ['Be authorized and trained to use the equipment.', 'Report any observed issues with the equipment.', 'Update the logbook when they use the equipment.'] },\n      { role: 'Department Head', duties: ['Oversees whether the tasks and instructions are followed.'] },\n      { role: 'Laboratory Adviser', duties: ['Oversees the experiments of students currently taking the subject.'] }\n    ].map((r, i) => ({ n: '5.' + (i + 1), role: r.role, duties: r.duties.map((t) => ({ text: t })) }));\n    const records = [\n      { n: '12.1', title: 'Borrower’s Logbook', text: 'All users sign this logbook before using the mixer. It is kept in the laboratory and checked by the Laboratory Head.', cols: ['Name of Borrower', 'Group / Section', 'Purpose of Use', 'Date', 'Time In / Out', 'Signature'] },\n      { n: '12.2', title: 'Maintenance Log Sheet', text: 'Every cleaning, inspection, repair or replacement is recorded here, including the part worked on and the condition of the equipment afterward.', cols: ['Date', 'Type of Maintenance', 'Part / Area', 'Findings or Action Taken', 'Person in Charge', 'Remarks'] },\n      { n: '12.3', title: 'Experiment and Batch Record', text: 'One sheet for every run: the date, group, experiment number, materials and amounts, mixing time and speed, and data collected. Any problem during the run is written down, and the sheet is signed by the group leader and checked by the Laboratory Adviser.', cols: [] },\n      { n: '12.4', title: 'Laboratory manual and experiment reports', text: 'The manual, together with the experiment reports in the appendix, is the main record of the mixer unit. Update it whenever the equipment is modified or a new experiment is added.', cols: [] }\n    ].map((r) => ({ n: r.n, title: r.title, text: r.text, hasCols: r.cols.length > 0, cols: r.cols.map((c) => ({ text: c })) }));\n    const results = [\n      { label: 'Integration constant, C', value: '27 °C', sub: 'T(0) = 62 °C, Ts = 35 °C' },\n      { label: 'Cooling constant, k', value: '−0.005856631', sub: 'per minute' },\n      { label: 'Heat loss at 62 °C', value: '33,048.97 J/min', sub: '≈ 550.8 W' },\n      { label: 'Natural cooling, 62 → 40 °C', value: '287.95 min', sub: '≈ 4.80 h' },\n      { label: 'Hot water needed to hold 62 °C', value: '89 °C', sub: 'minimum' }\n    ];\n    const pts = [[0, 62], [1, 61.84], [2, 61.69], [3, 61.53], [15, 59.73], [25, 58.32], [28, 57.92], [32, 57.39], [37, 56.74], [45, 55.74], [52, 54.91], [58, 54.22], [59, 54.11], [60, 54]];\n    const chartPath = pts.map((p, i) => (i === 0 ? 'M' : 'L') + (56 + p[0] * 560 / 60).toFixed(1) + ' ' + (276 - (p[1] - 53) * 25.6).toFixed(1)).join(' ');\n\n    // safety\n    const safetyGroups = [\n      { n: '8.1', title: 'Safety precautions', intro: 'Moving parts, hot surfaces and electrical connections are all present during operation.', items: ['Only authorized and trained users may operate the mixer.', 'Wear a lab gown, safety goggles, closed shoes and gloves.', 'Tie back long hair and remove loose jewelry or clothing that can be caught by moving parts.', 'Keep all guards in place while the mixer is running.', 'Never reach into the vessel or touch the shaft, belt or pulley while the motor is on.', 'Do not exceed the 50 L capacity, the 54,000 cP viscosity limit or the 90 °C temperature limit.', 'Make sure the mixer clamp is secured before switching on.', 'Sign the Borrower’s Logbook before use.'] },\n      { n: '8.2', title: 'Electrical safety', intro: 'The motor runs on mains power and the work area is often wet.', items: ['Inspect the power cord and plug before use. Do not use the equipment if they are damaged.', 'Plug only into a grounded outlet that complies with the Philippine Electrical Code.', 'Keep hands, floor and the work area dry when handling the plug and switch.', 'Switch off and unplug the mixer before cleaning, adjusting or repairing it, following the lockout/tagout principle of OSHA 29 CFR 1910.147.', 'Do not leave the mixer running unattended.'] },\n      { n: '8.3', title: 'Chemical safety', intro: 'Follows DOLE Department Order No. 136, Series of 2014 (Chemical Safety Program, based on the Globally Harmonized System).', items: ['Read the Safety Data Sheet (SDS) of every chemical before use.', 'Surfactants such as SLES can irritate the eyes and skin. Avoid direct contact and wear gloves and goggles.', 'Label all containers with the name of the chemical.', 'Add chemicals slowly to avoid splashing and foaming.', 'Use hot water carefully. Allow the jacket to cool before draining.', 'Wipe spills right away and dispose of waste according to laboratory rules.'] }\n    ].map((g) => ({ n: g.n, title: g.title, intro: g.intro, items: g.items.map((t) => ({ text: t })) }));\n    const emergencies = [\n      ['Abnormal noise, vibration or smoke', 'Switch off, unplug, and inform the Laboratory Head.'],\n      ['Electrical shock or fire', 'Cut the power if it is safe to do so, use the nearest fire extinguisher for small fires, and evacuate if it spreads.'],\n      ['Chemical in the eyes', 'Rinse with water for at least 15 minutes and seek medical help.'],\n      ['Chemical on the skin', 'Remove contaminated clothing and wash with running water.'],\n      ['Hot water burn', 'Cool the area under running water and seek medical help.'],\n      ['Spill', 'Contain it, wipe it up, and keep others away until it is clean.']\n    ].map((e) => ({ situation: e[0], action: e[1] }));\n\n    // docs\n    const toc = ['Purpose', 'Scope', 'Associated documents', 'Definitions', 'Responsibility', 'Function of equipment', 'Components and process flow diagram', 'Safety requirements', 'Instructions', 'Troubleshoot', 'Maintenance', 'Records', 'References', 'Appendix: Experiment #1'].map((t, i) => ({ n: i < 12 ? (i + 1) + '.0' : '—', title: t }));\n    const defs = [\n      ['Mixer', 'A device or machine used to blend, combine or mix various substances or components.'],\n      ['Turbine', 'A rotary mechanical apparatus that converts energy extracted from a working fluid into work, usually as rotation of a shaft.'],\n      ['Inside vessel', 'The interior space or container of a larger structure, such as industrial equipment or reactors.'],\n      ['Motor', 'A machine that converts electrical energy into mechanical energy, generating rotational motion.'],\n      ['Impellers', 'Rotating blades or vanes used to impart motion to a fluid, generating flow, mixing or propulsion.'],\n      ['Mixer clamp', 'A mechanism that securely fastens a mixer to a vessel, ensuring stability during operation.'],\n      ['Belt', 'A flexible loop of material, commonly rubber or fabric, used to transmit motion or power between two rotating shafts.'],\n      ['Pulley', 'A wheel with a grooved rim that supports the movement of a belt, rope or cable.'],\n      ['Shaft', 'A long, slender, rotating rod that transmits power or torque from one part of a machine to another.']\n    ].map((d) => ({ term: d[0], text: d[1] }));\n\n    return {\n      nav: nav,\n      cards: cards,\n      goHome: go('home'),\n      goDocs: go('docs'),\n      isHome: page === 'home',\n      notHome: page !== 'home',\n      title: current.title,\n      desc: current.desc,\n      eyebrow: pad(idx - 1) + ' / ' + current.label,\n      specs: [\n        { value: '50 L', label: 'Total vessel capacity' },\n        { value: '370 W', label: 'Motor power rating' },\n        { value: '< 90 °C', label: 'Operating temperature' },\n        { value: '54,000 cP', label: 'Maximum viscosity' },\n        { value: 'Stainless', label: 'Steel construction' }\n      ],\n      specTable: [\n        { k: 'Total volume capacity', v: '50 liters' },\n        { k: 'Motor power rating', v: '370 watts' },\n        { k: 'Operating temperature', v: 'Lower than 90 °C' },\n        { k: 'Viscosity', v: 'Up to 54,000 centipoises' },\n        { k: 'Construction', v: 'Stainless steel, detachable parts' },\n        { k: 'Process type', v: 'Batch process' }\n      ],\n      components: comps.map((c, i) => ({ n: pad(i), name: c[0], fn: c[1] })),\n      lanes: lanes,\n      isEquipment: page === 'equipment',\n      isProcedure: page === 'procedure',\n      isMaintenance: page === 'maintenance',\n      isLab: page === 'lab',\n      isSafety: page === 'safety',\n      isModel: page === 'model',\n      isDocs: page === 'docs',\n      assembly: assembly,\n      checks: checks,\n      checkedCount: checkedCount,\n      freqChips: freqChips,\n      tasks: tasks,\n      q: st.q,\n      onSearch: (e) => this.setState({ q: e && e.target ? e.target.value : '' }),\n      issues: issues,\n      issueCount: issueCount,\n      roles: roles,\n      records: records,\n      results: results,\n      chartPath: chartPath,\n      safetyGroups: safetyGroups,\n      emergencies: emergencies,\n      toc: toc,\n      defs: defs\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
